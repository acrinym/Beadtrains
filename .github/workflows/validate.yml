name: Validate beadtrains

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test extras
        run: python -m pip install pytest pytest-timeout
      - name: Validate classroom examples
        run: |
          python scripts/validate_beadtrain.py examples/example_primary_demo.beadtrain
          python scripts/validate_beadtrain.py examples/example_secondary_demo.beadtrain
      - name: V3 engine tests
        run: python -m pytest tests/test_beadtrain_v3.py -v --timeout=120

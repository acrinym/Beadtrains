name: Validate beadtrains

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and test extras
        run: python -m pip install -e ".[dev]"
      - name: Validate classroom examples as a coupler set
        run: validate-beadtrain examples/
      - name: Tests
        run: python -m pytest tests/ -v --timeout=120
